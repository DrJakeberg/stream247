name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release-image:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      # write: the last step creates the GitHub release for the tag.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm validate
      - id: release-preflight-env
        run: echo "path=$(./scripts/prepare-release-preflight-env.sh)" >> "$GITHUB_OUTPUT"
      - run: RELEASE_PREFLIGHT_ENV_FILE="${{ steps.release-preflight-env.outputs.path }}" RELEASE_PREFLIGHT_SKIP_VALIDATE=1 pnpm release:preflight
      - id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/drjakeberg/stream247-web
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/drjakeberg/stream247-worker
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - id: meta-playout
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/drjakeberg/stream247-playout
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull tested main snapshot artifacts for this tag commit
        run: |
          set -euo pipefail
          SOURCE_SHA="${GITHUB_SHA::7}"

          # These snapshots are published by the CI workflow for the same commit. Pushing main and
          # the tag together starts both workflows at once, so the images routinely do not exist
          # yet when this step first runs -- that is what failed the v1.5.18 release outright.
          # Wait for CI to publish rather than giving up on the first miss.
          wait_for_image() {
            image="$1"
            for attempt in $(seq 1 60); do
              if docker pull "$image" >/dev/null 2>&1; then
                echo "Pulled $image"
                return 0
              fi
              echo "Waiting for $image (attempt $attempt/60)..."
              sleep 30
            done
            echo "Timed out waiting for $image. Check that the CI run for this commit succeeded." >&2
            return 1
          }

          wait_for_image "ghcr.io/drjakeberg/stream247-web:main-${SOURCE_SHA}"
          wait_for_image "ghcr.io/drjakeberg/stream247-worker:main-${SOURCE_SHA}"
          wait_for_image "ghcr.io/drjakeberg/stream247-playout:main-${SOURCE_SHA}"
          docker image tag "ghcr.io/drjakeberg/stream247-web:main-${SOURCE_SHA}" stream247-web:release-candidate
          docker image tag "ghcr.io/drjakeberg/stream247-worker:main-${SOURCE_SHA}" stream247-worker:release-candidate
          docker image tag "ghcr.io/drjakeberg/stream247-playout:main-${SOURCE_SHA}" stream247-playout:release-candidate
      - run: chmod +x docker/smoke-test.sh && ./docker/smoke-test.sh stream247-web:release-candidate
      - run: STREAM247_FRESH_COMPOSE_WEB_IMAGE=stream247-web:release-candidate STREAM247_FRESH_COMPOSE_WORKER_IMAGE=stream247-worker:release-candidate STREAM247_FRESH_COMPOSE_PLAYOUT_IMAGE=stream247-playout:release-candidate pnpm test:fresh-compose
      - name: Publish tested web release tags
        env:
          TARGET_TAGS: ${{ steps.meta-web.outputs.tags }}
        run: |
          set -euo pipefail
          source_image="stream247-web:release-candidate"
          source_id="$(docker image inspect "$source_image" --format '{{.Id}}')"
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            docker image tag "$source_image" "$tag"
            target_id="$(docker image inspect "$tag" --format '{{.Id}}')"
            if [ "$target_id" != "$source_id" ]; then
              echo "Retagged image id for $tag does not match the smoke-tested candidate."
              exit 1
            fi
            docker image push "$tag"
          done <<< "$TARGET_TAGS"
      - name: Publish tested worker release tags
        env:
          TARGET_TAGS: ${{ steps.meta-worker.outputs.tags }}
        run: |
          set -euo pipefail
          source_image="stream247-worker:release-candidate"
          source_id="$(docker image inspect "$source_image" --format '{{.Id}}')"
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            docker image tag "$source_image" "$tag"
            target_id="$(docker image inspect "$tag" --format '{{.Id}}')"
            if [ "$target_id" != "$source_id" ]; then
              echo "Retagged image id for $tag does not match the smoke-tested candidate."
              exit 1
            fi
            docker image push "$tag"
          done <<< "$TARGET_TAGS"
      - name: Publish tested playout release tags
        env:
          TARGET_TAGS: ${{ steps.meta-playout.outputs.tags }}
        run: |
          set -euo pipefail
          source_image="stream247-playout:release-candidate"
          source_id="$(docker image inspect "$source_image" --format '{{.Id}}')"
          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            docker image tag "$source_image" "$tag"
            target_id="$(docker image inspect "$tag" --format '{{.Id}}')"
            if [ "$target_id" != "$source_id" ]; then
              echo "Retagged image id for $tag does not match the smoke-tested candidate."
              exit 1
            fi
            docker image push "$tag"
          done <<< "$TARGET_TAGS"
      # Last on purpose: a release appears only for a tag whose images were smoke-tested and pushed.
      # Until 2026-10-01 this workflow published images only, and the Releases page stopped at
      # v1.5.17 while forty tags followed. The notes are the tag's CHANGELOG.md section; a tag
      # without one fails here instead of publishing an empty release. Re-running the workflow
      # updates the existing release.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          node scripts/release-notes.mjs "$version" > release-notes.md
          if [[ "$version" == *-* ]]; then
            kind=(--prerelease --latest=false)
          else
            kind=(--prerelease=false --latest)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Stream247 $version" --notes-file release-notes.md "${kind[@]}"
          else
            gh release create "$TAG" --verify-tag --title "Stream247 $version" --notes-file release-notes.md "${kind[@]}"
          fi
