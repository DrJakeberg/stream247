# Applied to every service: without a cap the default json-file driver grows without bound, and a
# 24/7 worker that logs every ffmpeg stderr line will eventually fill the OS disk — the one
# partition the media-root disk watermark does not watch.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  traefik:
    image: traefik:v3.4
    profiles: ["proxy"]
    restart: unless-stopped
    logging: *default-logging
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.${TRAEFIK_CERT_RESOLVER:-letsencrypt}.acme.email=${TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.${TRAEFIK_CERT_RESOLVER:-letsencrypt}.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.${TRAEFIK_CERT_RESOLVER:-letsencrypt}.acme.httpchallenge=true
      - --certificatesresolvers.${TRAEFIK_CERT_RESOLVER:-letsencrypt}.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
  web:
    image: ${STREAM247_WEB_IMAGE:-ghcr.io/drjakeberg/stream247-web:v1.5.20}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "3000:3000"
    expose:
      - "3000"
    # Optional since M52: a fresh install can start with no hand-written env file at all — the app
    # secret generates itself onto the data volume, the bundled Postgres matches the code defaults,
    # and the /setup wizard covers the rest. A present .env still overrides everything.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/media:/app/data/media
    labels:
      - traefik.enable=true
      - traefik.http.routers.stream247.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.stream247.entrypoints=websecure
      - traefik.http.routers.stream247.tls=true
      - traefik.http.routers.stream247.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.stream247.loadbalancer.server.port=3000
      - traefik.http.routers.stream247-http.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.stream247-http.entrypoints=web
      - traefik.http.routers.stream247-http.middlewares=stream247-https
      - traefik.http.middlewares.stream247-https.redirectscheme.scheme=https
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    image: ${STREAM247_WORKER_IMAGE:-ghcr.io/drjakeberg/stream247-worker:v1.5.20}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/media:/app/data/media
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/index.js", "healthcheck", "worker"]
      interval: 45s
      timeout: 45s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  relay:
    image: ${STREAM247_RELAY_IMAGE:-bluenviron/mediamtx:1.15.4}
    restart: unless-stopped
    logging: *default-logging
    # M57 stage 2: the relay stops running on image defaults. The mounted config turns on HTTP
    # auth against the web app, keeps the control API and RTSP read side container-internal, and
    # the ONLY host ports are the two ingest doors for pushed camera feeds. The API port (9997)
    # must never be published to the host — it can inject and kick streams.
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
    expose:
      - "1935"
      - "8554"
      - "9997"
    ports:
      - "1935:1935"
      - "8890:8890/udp"
  playout:
    image: ${STREAM247_PLAYOUT_IMAGE:-ghcr.io/drjakeberg/stream247-playout:v1.5.20}
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "apps/worker/dist/index.js", "playout"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/media:/app/data/media
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/index.js", "healthcheck", "playout"]
      interval: 45s
      timeout: 45s
      retries: 5
      start_period: 60s
    depends_on:
      relay:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  uplink:
    image: ${STREAM247_WORKER_IMAGE:-ghcr.io/drjakeberg/stream247-worker:v1.5.20}
    restart: unless-stopped
    logging: *default-logging
    command: ["node", "apps/worker/dist/index.js", "uplink"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data/media:/app/data/media
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/index.js", "healthcheck", "uplink"]
      interval: 45s
      timeout: 45s
      retries: 5
      start_period: 60s
    depends_on:
      relay:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stream247}
      POSTGRES_USER: ${POSTGRES_USER:-stream247}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stream247}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stream247} -d ${POSTGRES_DB:-stream247}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
